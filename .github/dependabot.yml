version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Paquetes que tienen que actualizarse juntos (si no, el build falla por versiones distintas)
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    ignore:
      # TypeScript 7 todavía no es compatible con ESLint (typescript-eslint). Revisar más adelante.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tiene que coincidir con la versión de Node donde corre el sitio (no la última)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
